# Render Blueprint: web service (free), PostgreSQL (free),
# bot worker va cron job (Render'da pullik starter tarifda ishlaydi).
databases:
  - name: evently-db
    plan: free
    databaseName: evently
    user: evently

services:
  - type: web
    name: evently-api
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: TIME_ZONE
        value: Asia/Tashkent
      - key: DATABASE_URL
        fromDatabase:
          name: evently-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: BOT_API_SECRET
        sync: false
      - key: REMINDER_HOURS_BEFORE
        value: "24"

  - type: worker
    name: evently-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.main
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BOT_API_SECRET
        sync: false
      - key: BACKEND_API_URL
        sync: false

  - type: cron
    name: evently-reminders
    runtime: python
    plan: starter
    schedule: "*/10 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py send_event_reminders
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: TIME_ZONE
        value: Asia/Tashkent
      - key: DATABASE_URL
        fromDatabase:
          name: evently-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: REMINDER_HOURS_BEFORE
        value: "24"
